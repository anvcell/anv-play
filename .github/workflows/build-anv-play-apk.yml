name: Build AnV Play Android TV APK

on:
  push:
    paths:
      - "android-overlay/**"
      - ".github/workflows/build-anv-play-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-overlay
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnV-Play-TV-APK
          path: android-overlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error