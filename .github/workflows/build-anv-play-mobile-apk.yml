name: Build AnV Play Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-webview/**'
      - '.github/workflows/build-anv-play-mobile-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        uses: android-actions/setup-android@v3
      - name: Assemble debug APK
        run: |
          cd android-webview
          chmod +x gradlew 2>/dev/null || true
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnV-Play-Mobile-APK
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
